name: Fashion reels email report
on:
  workflow_run:
    workflows: [Daily fashion reels refresh]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: fashion-reels-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send report through GitHub notifications
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const title = '패션 릴스 자동 보고 · PC 없이 받는 알림';
            const site = 'https://qntmxj294-maker.github.io/fashion-reels-tracker/';
            const read = async path => {
              const {data} = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            let issue = issues.find(x => !x.pull_request && x.title === title);
            let previous = null;
            if (issue) {
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: issue.number, per_page: 100});
              for (const entry of [issue, ...comments].reverse()) {
                if (entry.user?.login !== 'github-actions[bot]') continue;
                const match = (entry.body || '').match(/<!-- report-state: (.+) -->/);
                if (match) { previous = JSON.parse(match[1]); break; }
              }
            }
            let data, status, readError = false;
            try { data = await read('data/reels.json'); status = await read('data/status.json'); }
            catch (error) { readError = true; core.warning('Could not read public collection data.'); }
            const items = (data?.items || []).filter(x => Number(x.views) >= 10000000 && /^[A-Za-z0-9_-]+$/.test(x.id));
            const ids = items.map(x => x.id).sort();
            const oldIds = new Set(previous?.ids || []);
            const fresh = items.filter(x => !oldIds.has(x.id));
            const errors = (status?.accounts || []).filter(x => x.status !== 'response_received');
            const conclusion = context.payload.workflow_run?.conclusion;
            const last = status?.last_attempt_at;
            const stale = Boolean(last && Date.now() - Date.parse(last) > 48 * 3600000);
            const problem = JSON.stringify({readError, failed: conclusion && conclusion !== 'success' ? conclusion : null, stale, accounts: errors.map(x => [x.username, x.status]).sort()});
            const hasProblem = readError || stale || errors.length || (conclusion && conclusion !== 'success');
            if (previous && !fresh.length && previous.problem === problem) {
              core.info('No new reels or changed errors; no notification.'); return;
            }
            const representatives = new Map();
            for (const row of (previous ? fresh : items)) {
              const name = String(row.username || '').toLowerCase().replace(/^@/, '');
              if (!/^[a-z0-9._]+$/.test(name)) continue;
              if (!representatives.has(name) || Number(row.views) > Number(representatives.get(name).views)) representatives.set(name, row);
            }
            const timestamp = new Date().toLocaleString('ko-KR', {timeZone: 'Asia/Seoul'});
            const lines = [`## 패션 릴스 보고 — ${timestamp} (한국 시간)`, '',
              previous ? `새로 확인한 1,000만 뷰 이상 릴스: **${fresh.length}개**` : '이메일 보고 연결 확인입니다. 아래는 현재 보관 자료이며, 모두 오늘 새로 발견한 영상이라는 뜻은 아닙니다.',
              `보관 영상 ${readError ? '확인 불가' : items.length}개 · 추적 계정 ${data?.monitored_accounts?.length ?? '확인 불가'}개`, '',
              `수집 상태: **${hasProblem ? '확인 필요' : '정상'}**`,
              `마지막 수집 시도: ${last ? new Date(last).toLocaleString('ko-KR', {timeZone: 'Asia/Seoul'}) + ' (한국 시간)' : '확인 불가'}`, ''];
            if (readError) lines.push('- 공개 수집 데이터를 읽지 못했습니다.');
            if (conclusion && conclusion !== 'success') lines.push(`- 수집 작업 결과: ${conclusion}`);
            if (stale) lines.push('- 수집 데이터가 48시간 이상 갱신되지 않았습니다.');
            if (errors.length) lines.push(`- 응답 오류 계정 수: ${errors.length}개`);
            for (const [name, row] of [...representatives].sort((a, b) => Number(b[1].views) - Number(a[1].views)).slice(0, 12)) {
              lines.push(`- **${name}** · ${Number(row.views).toLocaleString('ko-KR')}회 · [릴스 보기](https://www.instagram.com/reel/${row.id}/)`);
            }
            lines.push('', '계정당 대표 영상 1개만 표시합니다. 계정명은 추적 계정 기준이며, 공동 게시물의 실제 작성자와 다를 수 있습니다. 조회수는 수집 당시 수치입니다.', '', `[미리보기 사이트 열기](${site})`, '', '이 보고는 GitHub 서버에서 생성하므로 PC와 Codex를 꺼도 실행됩니다. 변화가 없으면 반복 발송하지 않습니다. 이메일 전달은 GitHub 알림 설정과 메일 수신 상태에 따릅니다.');
            const runUrl = context.payload.workflow_run?.html_url || `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            lines.push(`[실행 기록](${runUrl})`);
            const state = {ids: readError ? (previous?.ids || []) : [...new Set([...(previous?.ids || []), ...ids])].sort(), problem};
            lines.push(`<!-- report-state: ${JSON.stringify(state)} -->`);
            const body = lines.join('\n');
            if (issue) await github.rest.issues.createComment({owner, repo, issue_number: issue.number, body});
            else issue = (await github.rest.issues.create({owner, repo, title, body, assignees: [owner]})).data;
            core.info(`Report: ${issue.html_url}`);
